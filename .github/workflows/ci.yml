name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:traceability
      - run: pnpm check:test-plan
      - run: pnpm test:gates

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/*/go.sum
      - name: go vet (every module, and the module-less load generator)
        run: |
          for mod in $(find services -name go.mod -exec dirname {} \; | sort); do
            echo "::group::go vet $mod"
            (cd "$mod" && go vet ./...) || exit 1
            echo "::endgroup::"
          done
          (cd scripts/go-seckill-http-loadgen && go vet main.go)
      - name: go test (modules whose tests run without Docker)
        run: |
          for mod in $(find services -name go.mod -exec dirname {} \; | sort); do
            if [ "$mod" = services/go-backend-e2e ]; then continue; fi # needs docker compose
            echo "::group::go test $mod"
            (cd "$mod" && go test ./...) || exit 1
            echo "::endgroup::"
          done
